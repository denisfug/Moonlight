name: Build PS4 PKG

on:
  push:
    branches:
      - 'claude/fase-1-base'
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake make clang lld python3 wget tar zip xz-utils
          # PkgTool.Core (OpenOrbis) precisa de libssl.so.1.1 (OpenSSL 1.1)
          # Ubuntu 22.04+ só tem OpenSSL 3; baixamos o .deb do Ubuntu 20.04 (Focal)
          wget -q http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb

      - name: Download OpenOrbis Toolchain
        run: |
          wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          mkdir -p oosdk
          tar -xzf toolchain-llvm-18.tar.gz -C oosdk --strip-components=1
          echo "OO_PS4_TOOLCHAIN=$(pwd)/oosdk/PS4Toolchain" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN"
          ls "$OO_PS4_TOOLCHAIN"
          test -f "$OO_PS4_TOOLCHAIN/link.x" && echo "link.x OK" || (echo "ERRO: link.x não encontrado"; find oosdk -name "link.x" | head -5; exit 1)

      - name: Download GoldHEN SDK (optional)
        run: |
          if wget -q --timeout=30 https://github.com/GoldHEN/GoldHEN_Plug_SDK/archive/refs/heads/main.zip -O goldhen.zip 2>/dev/null; then
            unzip -q goldhen.zip
            echo "GOLDHEN_SDK=$(pwd)/GoldHEN_Plug_SDK-main" >> $GITHUB_ENV
            echo "GoldHEN SDK: OK"
          else
            echo "GoldHEN SDK indisponivel — build sem suporte USB music (nao eh erro fatal)"
          fi

      - name: Build libc++ for PS4
        run: |
          cd $GITHUB_WORKSPACE
          bash toolchain/build-libcxx.sh

      - name: Build PS4 PKG
        run: |
          cd $GITHUB_WORKSPACE
          make pkg

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-HB-PKG
          path: out/*.pkg
          retention-days: 30

      - name: Show result
        run: ls -lh out/*.pkg
